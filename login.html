<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 text-center border-0 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="mb-3">
            <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fs-6">Northwind API</span>
        </div>
        <h3 class="fw-bold text-dark mb-2">Iniciar Sesión</h3>
        <p class="text-muted mb-4 small">
            Acceso administrativo mediante Google OAuth (Cookies de sesión).
        </p>

        <button id="btnLogin" class="btn btn-outline-dark py-2 px-3 fw-semibold shadow-sm w-100">
            Iniciar sesión con Google
        </button>
    </div>

    <!-- Controlador exclusivo de Login -->
    <script type="module" src="./src/controllers/loginController.js"></script>
</body>
</html>
